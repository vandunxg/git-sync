[package]
name = "git-backup-manager"
description = "Git Backup Manager desktop shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "git_backup_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
gbm-application = { path = "../../../crates/application" }
gbm-domain = { path = "../../../crates/domain" }
gbm-infrastructure = { path = "../../../crates/infrastructure" }
serde = "1.0.229"
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = [] }
# Native folder picker for the backup root, invoked from Rust only (no renderer permission).
tauri-plugin-dialog = "2.8.1"

[dev-dependencies]
# `test` exposes tauri::test (mock runtime) for IPC router tests only.
tauri = { version = "2.12.1", features = ["test"] }

[lints]
workspace = true
