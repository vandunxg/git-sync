[package]
name = "gbm-infrastructure"
description = "Adapters for Git Backup Manager: SQLite, keyring, providers, Git, platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gbm-application = { path = "../application" }
gbm-domain = { path = "../domain" }
# Secret Service (Linux) via keyring-core + the zbus store, as the keyring 4 docs advise
# for applications. async-io runtime: zbus runs its own executor, independent of tokio.
keyring-core = "1.0.0"
# HTTPS client for provider APIs: rustls (platform verifier), HTTP/2; no default
# features, so no implicit system/env proxy and no charset sniffing.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
serde_json = "1.0.151"
# sqlite-bundled (not the `sqlite` umbrella feature, which also enables extension
# loading); runtime queries only, `macros` is needed for `sqlx::migrate!`.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }

[dev-dependencies]
gbm-test-fixtures = { path = "../test-fixtures" }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true
