[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Release profile from the audited template (tauri.app/concept/size).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
